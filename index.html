<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#15171c;color:#eee;font-family:system-ui,"Arial Hebrew",Arial,sans-serif;overflow:hidden;touch-action:none}
#wrap{display:flex;flex-direction:column;align-items:center;height:100%}
#screen{position:relative;width:min(100vw,150vh,960px);aspect-ratio:3/2;background:#000;overflow:hidden;--u:3px}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hint{padding:10px;font-size:13px;opacity:.6;text-align:center}
#mbtn{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);font-size:calc(var(--u)*7);padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:99px;border:0;background:rgba(255,255,255,.75);color:#333;font-weight:700;cursor:pointer}
#dialog{position:absolute;left:calc(var(--u)*2);right:calc(var(--u)*2);bottom:calc(var(--u)*2);height:calc(var(--u)*44);background:#fbfbf5;color:#222;border:calc(var(--u)*1.5) solid #3b6ea5;border-radius:calc(var(--u)*4);padding:calc(var(--u)*4) calc(var(--u)*6);font-size:calc(var(--u)*8.5);line-height:1.3;font-weight:600;cursor:pointer;white-space:pre-line}
#dialog.half{padding-left:52%}
#darrow{position:absolute;left:calc(var(--u)*5);bottom:calc(var(--u)*2);color:#c33;animation:bob .6s infinite alternate}
#dialog.half #darrow{display:none}
@keyframes bob{to{transform:translateY(calc(var(--u)*2))}}
#menu{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*4);width:49%;display:grid;gap:calc(var(--u)*1.5);max-height:94%;z-index:5}
#menu button{font:inherit;font-weight:700;font-size:calc(var(--u)*7);padding:calc(var(--u)*2.6) calc(var(--u)*2);border-radius:calc(var(--u)*3);border:calc(var(--u)*1) solid #999;background:#fff;color:#222;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu button.sel{border-color:#e0492f;background:#fff1c9}
#menu button.dis{opacity:.45}
#battle{position:absolute;inset:0;background:linear-gradient(#9fd8f5 0 38%,#8fd47a 38% 100%)}
#battle::before,#battle::after{content:"";position:absolute;border-radius:50%;background:#6fbf5e;box-shadow:inset 0 calc(var(--u)*-3) 0 #57a34a}
#battle::before{width:38%;height:14%;right:6%;top:30%}
#battle::after{width:44%;height:16%;left:3%;bottom:27%}
.spr{position:absolute;line-height:1;z-index:1;filter:drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.2))}
#espr{font-size:calc(var(--u)*42);top:calc(var(--u)*6);right:calc(var(--u)*30)}
#pspr{font-size:calc(var(--u)*52);bottom:calc(var(--u)*46);left:calc(var(--u)*26);transform:scaleX(-1)}
.bx{position:absolute;width:44%;background:#fbfbf5;color:#222;border:calc(var(--u)*1.2) solid #444;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.5) calc(var(--u)*4);font-size:calc(var(--u)*7.5);font-weight:700;z-index:2}
#ebox{top:calc(var(--u)*6);left:calc(var(--u)*6)}
#pbox{bottom:calc(var(--u)*52);right:calc(var(--u)*6)}
.bx .row{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.bx small{font-size:.8em;font-weight:600}
.tp{font-size:.75em;color:#fff;border-radius:99px;padding:0 .6em;margin-inline-start:.4em}
.hp,.xp{height:calc(var(--u)*4);background:#555;border-radius:99px;margin-top:calc(var(--u)*2);overflow:hidden;direction:ltr}
.xp{height:calc(var(--u)*2)}
.hp i,.xp i{display:block;height:100%;width:100%;background:#3cc15a;transition:width .4s}
.xp i{background:#4aa3f0}
.hit{animation:hit .4s steps(2) 1}
@keyframes hit{50%{opacity:0}}
.atkE{animation:atkE .3s}.atkP{animation:atkP .3s}
@keyframes atkE{50%{translate:calc(var(--u)*-14) calc(var(--u)*8)}}
@keyframes atkP{50%{translate:calc(var(--u)*14) calc(var(--u)*-8)}}
.faint{transition:translate .5s,opacity .5s;translate:0 calc(var(--u)*30);opacity:0}
.ball{animation:ball .5s infinite alternate}
@keyframes ball{to{rotate:20deg}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.on{animation:fl .45s steps(6)}
@keyframes fl{0%,40%,80%{opacity:1}20%,60%,100%{opacity:0}}
#title{position:absolute;inset:0;background:linear-gradient(#7fd0f7,#bff0b0 60%,#6cc05c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);z-index:10;color:#234}
#title h1{margin:0;font-size:calc(var(--u)*34);color:#fff;text-shadow:0 calc(var(--u)*2) 0 #2b6cb0,0 calc(var(--u)*4) 0 rgba(0,0,0,.2);letter-spacing:.03em}
#title p{margin:0;font-size:calc(var(--u)*9);font-weight:700}
#title .zoo{font-size:calc(var(--u)*20)}
#title button{font:inherit;font-weight:800;font-size:calc(var(--u)*9);padding:calc(var(--u)*3) calc(var(--u)*12);border-radius:99px;border:0;background:#e0492f;color:#fff;cursor:pointer;box-shadow:0 calc(var(--u)*1.5) 0 #9c2a17}
#title button.alt{background:#fff;color:#333;box-shadow:0 calc(var(--u)*1.5) 0 #999}
#pad{display:none}
@media (pointer:coarse){
 #hint{display:none}
 #pad{display:block}
 #pad button{position:fixed;border:0;background:rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:22px;border-radius:50%;z-index:20;touch-action:none}
 #pad .d{width:58px;height:58px;border-radius:14px}
 #pU{left:74px;bottom:138px}#pD{left:74px;bottom:22px}#pL{left:16px;bottom:80px}#pR{left:132px;bottom:80px}
 #pA{right:18px;bottom:96px;width:74px;height:74px}#pB{right:96px;bottom:36px;width:66px;height:66px}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wrap">
 <div id="screen">
  <canvas id="cv" width="240" height="160"></canvas>
  <button id="mbtn">☰ תפריט</button>
  <div id="battle" hidden>
   <div class="bx" id="ebox"><div class="row"><span><span id="en"></span><span class="tp" id="et"></span></span><small id="el"></small></div><div class="hp"><i id="ehp"></i></div></div>

  </div>
  <div id="dialog" hidden><span id="dtext"></span><span id="darrow">▼</span></div>

   <div class="zoo">🦊🐢🦔</div>

 </div>

 <div id="pad">
  <button class="d" id="pU">▲</button><button class="d" id="pD">▼</button><button class="d" id="pL">◀</button><button class="d" id="pR">▶</button>
  <button id="pA">A</button><button id="pB">B</button>
 </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- data ---------- */
const TYPES={n:['רגיל','#9a9484'],f:['אש','#ee7b2c'],w:['מים','#3f8be0'],p:['צמח','#4caa4c'],e:['חשמל','#d8ae10'],g:['אדמה','#a87c48'],a:['אוויר','#6fa6dc']};
const EFF={n:{},f:{p:2,w:.5,f:.5,g:.5},w:{f:2,g:2,w:.5,p:.5},p:{w:2,g:2,f:.5,p:.5,a:.5},e:{w:2,a:2,e:.5,p:.5,g:.5},g:{f:2,e:2,p:.5,a:.5},a:{p:2,e:.5,g:.5}};
const MOVES={push:['דחיפה','n',40,100],scratch:['שריטה','n',40,100],bite:['נשיכה','n',60,100],charge:['הסתערות','n',85,90],
 f1:['גץ','f',40,100],f2:['להבה','f',65,100],f3:['סופת אש','f',95,85],
 w1:['התזה','w',40,100],w2:['סילון','w',65,100],w3:['נחשול','w',95,85],
 p1:['עלה חד','p',40,100],p2:['שוט קנוקנת','p',65,100],p3:['סופת עלים','p',95,85],
 e1:['ניצוץ','e',40,100],e2:['הלם','e',65,100],e3:['ברק','e',95,85],
 g1:['זריקת בוץ','g',40,100],g2:['מפולת','g',65,100],g3:['רעידה','g',95,85],
 a1:['משב','a',40,100],a2:['מכת כנף','a',65,100],a3:['טורנדו','a',95,85]};
const SP={
 fox:{n:'שועלהב',e:'🦊',t:'f',b:[45,55,42,62],evo:['lion',14]},
 lion:{n:'אריאש',e:'🦁',t:'f',b:[70,85,65,85]},
 turtle:{n:'צבטיף',e:'🐢',t:'w',b:[52,46,62,40],evo:['croc',14]},
 croc:{n:'תניגל',e:'🐊',t:'w',b:[80,80,85,55]},
 hedge:{n:'קיפודשא',e:'🦔',t:'p',b:[48,50,52,48],evo:['deer',14]},
 deer:{n:'אייליער',e:'🦌',t:'p',b:[78,82,72,70]},
 mouse:{n:'עכברק',e:'🐭',t:'e',b:[38,50,35,80]},
 chick:{n:'ציפצוף',e:'🐦',t:'a',b:[40,44,38,58],evo:['eagle',12]},
 eagle:{n:'נשרוח',e:'🦅',t:'a',b:[65,78,60,88]},
 bunny:{n:'ארנבוץ',e:'🐰',t:'n',b:[45,45,40,65]},
 frog:{n:'קרקרן',e:'🐸',t:'w',b:[48,48,45,50]},
 worm:{n:'זחלון',e:'🐛',t:'p',b:[40,35,40,35],evo:['fly',8]},
 fly:{n:'פרפרוח',e:'🦋',t:'a',b:[60,65,55,75]},
 lizard:{n:'לטאבן',e:'🦎',t:'g',b:[50,60,65,55]},
 boar:{n:'חזירסלע',e:'🐗',t:'g',b:[70,75,70,45]},
 snake:{n:'נחשמל',e:'🐍',t:'e',b:[55,72,50,75]},
 owl:{n:'ינשוף',e:'🦉',t:'a',b:[62,66,60,68]},
 dragon:{n:'דרקואש',e:'🐲',t:'f',b:[88,95,80,80]}};
const WILD=[{y:[54,62],lv:[2,4],sp:['bunny','chick','worm','bunny']},{y:[43,52],lv:[5,8],sp:['mouse','frog','chick','worm','frog']},{y:[13,25],lv:[11,15],sp:['lizard','boar','snake','owl']}];
const PRICE={cap:15,pot:25};

const nm=c=>SP[c.id].n;
const learnset=id=>{const t=SP[id].t;return t=='n'?[[1,'push'],[1,'scratch'],[7,'bite'],[15,'charge']]:[[1,'push'],[1,t+'1'],[7,'bite'],[11,t+'2'],[17,'charge'],[22,t+'3']]};
function addMove(c,m){if(c.moves.includes(m))return false;c.moves.push(m);if(c.moves.length>4){let w=0;c.moves.forEach((x,i)=>{if(MOVES[x][2]<MOVES[c.moves[w]][2])w=i});c.moves.splice(w,1)}return true}
const maxHp=c=>Math.floor(SP[c.id].b[0]*2*c.lvl/100)+c.lvl+10;
const stat=(c,i)=>Math.floor(SP[c.id].b[i]*2*c.lvl/100)+5;
function mk(id,lvl){const c={id,lvl,xp:lvl**3,hp:0,moves:[]};learnset(id).forEach(([l,m])=>{if(l<=lvl)addMove(c,m)});c.hp=maxHp(c);return c}
function dmgOf(a,d,mk_,rand){const [,t,pw]=MOVES[mk_];const eff=EFF[t][SP[d.id].t]??1;const stab=t==SP[a.id].t?1.5:1;
 let v=(((2*a.lvl/5+2)*pw*stat(a,1)/stat(d,2))/50+2)*stab*eff;const crit=rand&&Math.random()<.07;if(rand)v*=.85+Math.random()*.15;if(crit)v*=1.5;return{v:Math.max(1,Math.floor(v)),eff,crit}}

/* ---------- state ---------- */
const SAVE='critterra1';
let S; // {x,y,dir,party,box,inv,money,flags,resp}
const fresh=()=>({x:11,y:70,dir:'up',party:[],box:[],inv:{cap:0,pot:0},money:100,flags:[],resp:[11,69]});
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}};
const has=f=>S.flags.includes(f);

/* ---------- map ---------- */
const MW=24,MH=76,map=[];
for(let y=0;y<MH;y++)map.push(Array(MW).fill('T'));
const set=(x,y,c)=>map[y][x]=c,rect=(x,y,w,h,c)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j][i]=c};
const house=(x,y)=>{rect(x,y,4,2,'^');rect(x,y+2,4,1,'H');set(x+1,y+2,'D')};
rect(2,2,MW-4,MH-4,'.');
rect(11,4,2,68,'=');
rect(5,3,14,8,'s');[[5,3],[18,3],[5,10],[18,10],[8,3],[15,3]].forEach(([x,y])=>set(x,y,'R'));
[12,26,53,63].forEach(y=>{rect(0,y,MW,1,'T');set(11,y,'=')});
rect(0,40,MW,3,'W');rect(11,40,1,3,'B');
[[3,14,7,4],[14,17,7,5],[3,21,7,4],[3,44,7,4],[14,45,7,6],[4,49,6,3],[3,55,7,3],[14,56,7,5],[4,59,6,3]].forEach(r=>rect(...r,','));
[[9,16],[15,14],[18,24],[4,19],[20,15],[13,22],[8,24],[17,13],[9,45],[16,43],[8,57]].forEach(([x,y])=>set(x,y,y<26?'R':'T'));
rect(3,29,6,5,'W');house(15,28);house(15,34);house(4,65);house(16,65);
[[9,35],[10,36],[4,36],[5,37],[19,32],[3,70],[4,71],[19,70],[20,69],[8,66],[14,71],[9,28],[20,38]].forEach(([x,y])=>set(x,y,'F'));
const SIGNS={'13,64':'מסלול 1 ↑\nעשב גבוה = חיות פרא!','13,39':'כפר אגמונית\nמרפאה וחנות.','13,25':'מסלול 3 – הרי הסלע','13,11':'זירת האלופים\nרק החזקים נכנסים.','10,72':'כפר ניצן\nכאן מתחיל כל מסע.'};
Object.keys(SIGNS).forEach(k=>{const[x,y]=k.split(',');set(+x,+y,'S')});
const SOLID='TWR^HDS';

const NPCS=[
 {id:'prof',kind:'prof',x:17,y:68,c:{hat:'#eee',shirt:'#fff',pants:'#665'}},
 {id:'mom',kind:'heal',x:5,y:68,c:{hat:'#a0522d',shirt:'#e86a92'},line:'בוא חמוד, אני אטפל בחיות שלך.'},
 {id:'kid',kind:'talk',x:8,y:70,c:{hat:'#3a7',shirt:'#fc3'},lines:['בעשב הגבוה מסתתרות חיות פרא!','כדאי להחליש חיה לפני שזורקים עליה קפסולה.']},
 {id:'nurse',kind:'heal',x:16,y:31,c:{hat:'#f6a',shirt:'#fff'},line:'ברוך הבא למרפאת אגמונית!'},
 {id:'shop',kind:'shop',x:16,y:37,c:{hat:'#36c',shirt:'#3a9'}},
 {id:'fisher',kind:'talk',x:9,y:31,dir:'left',c:{hat:'#886',shirt:'#59c'},lines:['מים מנצחים אש, אש מנצחת צמח, צמח מנצח מים.','וחשמל? הוא מפחיד כל מה ששוחה או עף.']},
 {id:'t1',kind:'tr',name:'נועה',x:11,y:53,after:[13,54],team:[['worm',5],['chick',6]],reward:80,c:{hat:'#fc3',shirt:'#6b4'},pre:'אף אחד לא עובר בלי קרב!',post:'וואו, החיות שלך חזקות.'},
 {id:'tb',kind:'tr',name:'הדייג עומר',x:11,y:41,after:[10,43],team:[['frog',9],['turtle',10]],reward:140,c:{hat:'#557',shirt:'#48a'},pre:'הגשר הזה שלי! רוצה לעבור? תילחם.',post:'טוב, טוב, תעבור...'},
 {id:'t2',kind:'tr',name:'שירה',x:11,y:26,after:[13,27],team:[['mouse',12],['bunny',12],['eagle',13]],reward:220,c:{hat:'#c4a',shirt:'#fa5'},pre:'ההרים מסוכנים. בוא נבדוק אם אתה מוכן!',post:'אתה מוכן. בהצלחה למעלה!'},
 {id:'t3',kind:'tr',name:'השומר גיא',x:11,y:12,after:[13,13],team:[['boar',16],['snake',16],['owl',17]],reward:320,c:{hat:'#333',shirt:'#a33'},pre:'מכאן נכנסים לזירה. קודם תעבור אותי!',post:'האלופה מחכה לך. כבוד.'},
 {id:'champ',kind:'tr',name:'האלופה מאיה',x:11,y:5,after:[11,5],team:[['lion',19],['croc',19],['deer',20],['dragon',22]],reward:1000,c:{hat:'#fd3',shirt:'#72c',pants:'#222'},pre:'הגעת עד אליי? מרשים. עכשיו תראה מה זה קרב אמיתי!',post:'אתה האלוף של קריטרה! 🏆'}
];
NPCS.forEach(n=>{n.dir=n.dir||'down';n.ox=n.x;n.oy=n.y});
const placeNpcs=()=>NPCS.forEach(n=>{[n.x,n.y]=n.kind=='tr'&&has(n.id)?n.after:[n.ox,n.oy]});
const npcAt=(x,y)=>NPCS.find(n=>n.x==x&&n.y==y);
const free=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&!SOLID.includes(map[y][x])&&!npcAt(x,y);

/* ---------- tiles ---------- */
const cv=$('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const tiles={};
function tile(ch,fn){const c=document.createElement('canvas');c.width=c.height=16;const t=c.getContext('2d');let s=ch.charCodeAt(0)*7919;
 const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;const p=(x,y,w,h,col)=>{t.fillStyle=col;t.fillRect(x,y,w,h)};
 const sp=(n,col)=>{for(let i=0;i<n;i++)p(Math.floor(r()*15),Math.floor(r()*15),2,1,col)};fn(p,sp);tiles[ch]=c}
const grass=(p,sp)=>{p(0,0,16,16,'#7ccb58');sp(7,'#9be076');sp(5,'#5fb044')};
tile('.',grass);
tile(',',(p,sp)=>{grass(p,sp);for(let j=0;j<2;j++)for(let i=0;i<4;i++){const x=i*4+(j?2:0)-1,y=j*8+1;p(x+1,y,1,6,'#2f8f45');p(x,y+2,1,4,'#3fa552');p(x+2,y+2,1,4,'#3fa552');p(x+1,y+5,1,2,'#226f35')}});
tile('=',(p,sp)=>{p(0,0,16,16,'#ecd696');sp(8,'#d6bb74');sp(4,'#f6e6b4')});
tile('s',(p,sp)=>{p(0,0,16,16,'#e9d7b0');sp(6,'#cdb88c')});
tile('T',(p,sp)=>{grass(p,sp);p(6,11,4,5,'#7a4e2c');p(2,2,12,10,'#2e8b3e');p(4,0,8,2,'#2e8b3e');p(1,4,14,6,'#2e8b3e');p(4,2,5,3,'#53b85c');p(2,10,12,2,'#1f6b2c')});
tile('R',(p,sp)=>{grass(p,sp);p(2,5,12,9,'#948c84');p(4,3,8,2,'#948c84');p(4,5,5,3,'#c4bcb4');p(2,12,12,2,'#665e58')});
tile('F',(p,sp)=>{grass(p,sp);[[3,4],[10,9]].forEach(([x,y])=>{p(x,y,3,3,'#f0506a');p(x+1,y+1,1,1,'#ffe066');p(x+1,y+3,1,3,'#2f8f45')})});

tile('^',p=>{p(0,0,16,16,'#d2523f');for(let y=3;y<16;y+=4)p(0,y,16,1,'#a83a2c');p(0,0,16,1,'#e8806f')});

 const done=i=>{if(i>=0&&opts[i].dis){sfx(140);return}menuEl.hidden=true;dlg.classList.remove('half');modal=null;sfx(660);res(i<0||opts[i].back?-1:i)};

async function pickAction(){const{tr}=B;for(;;){const me=B.me;

 if(i==2){const c=await pickParty('את מי לשלוח?',c=>c!==me&&c.hp>0);if(c)return{t:'swap',c}}

async function battle(foes,tr){
 await flash();B={me:S.party.find(c=>c.hp>0),foe:foes[0],tr};let fi=0,res;
 ['espr','pspr'].forEach(i=>$(i).classList.remove('faint'));refresh();$('battle').hidden=false;

 if(tr)await say(`${tr.name} שולח את ${nm(B.foe)}!`);
 await say(`קדימה, ${nm(B.me)}!`);
 while(!res){
  const act=await pickAction(),fm=aiMove();let seq;
  if(act.t=='run'){if(Math.random()<(stat(B.me,3)>=stat(B.foe,3)?.9:.55)){await say('ברחת בשלום!');res='run';break}await say('לא הצלחת לברוח!')}
  if(act.t=='pot'){S.inv.pot--;B.me.hp=Math.min(maxHp(B.me),B.me.hp+30);refresh();sfx(880,.15);await say(`${nm(B.me)} התאושש בזכות השיקוי.`)}
  if(act.t=='swap'){await say(`${nm(B.me)}, חזור!`);B.me=act.c;refresh();await say(`קדימה, ${nm(B.me)}!`)}

   if(Math.random()<.95*(1-.72*B.foe.hp/maxHp(B.foe))){sfx(990,.3);await say(`יש! תפסת את ${nm(B.foe)}!`);
    if(S.party.length<6)S.party.push(B.foe);else{S.box.push(B.foe);await say('הצוות מלא, אז הוא נשלח לחווה.')}res='caught';break}
   refresh();await say('אוי לא, היא השתחררה!')}
  seq=act.t=='move'?(stat(B.me,3)>=stat(B.foe,3)?[[B.me,B.foe,act.m],[B.foe,B.me,fm]]:[[B.foe,B.me,fm],[B.me,B.foe,act.m]]):[[B.foe,B.me,fm]];
  for(const[a,d,m]of seq)if(a.hp>0&&d.hp>0)await attack(a,d,m);
  if(B.foe.hp<=0){$('espr').classList.add('faint');await say(`${who(B.foe)} התעלף!`);

   if(++fi<foes.length){B.foe=foes[fi];$('espr').classList.remove('faint');refresh();await say(`${tr.name} שולח את ${nm(B.foe)}!`)}else res='win'}
  else if(B.me.hp<=0){$('pspr').classList.add('faint');await say(`${nm(B.me)} התעלף!`);
   if(S.party.some(c=>c.hp>0)){let c;while(!c)c=await pickParty('את מי לשלוח?',c=>c.hp>0);B.me=c;$('pspr').classList.remove('faint');refresh();await say(`קדימה, ${nm(c)}!`)}else res='lose'}
 }
 if(res=='win'&&tr){await say(`ניצחת את ${tr.name}!`);S.money+=tr.reward;await say(`קיבלת ${tr.reward} מטבעות.`)}
 if(res=='lose'){await say('כל החיות שלך התעלפו...');await say('מיהרת חזרה למקום בטוח, והחיות טופלו.');[S.x,S.y]=S.resp;S.dir='down';healAll();P.moving=false}

 else if(n.kind=='heal'){await say(n.line);healAll();S.resp=[S.x,S.y];sfx(990,.3);await say(S.party.length?'החיות שלך בריאות ורעננות! 💖':'כשתהיה לך חיה, אטפל בה בשמחה.')}

  else{if(!S.inv.cap){S.inv.cap+=3;await say('נגמרו לך הקפסולות? קח שלוש, עליי.')}await say(`עד עכשיו תפסת ${S.party.length+S.box.length} חיות. המשך כך!`)}}
 else if(n.kind=='shop'){for(;;){const i=await ask(`ברוך הבא! יש לך ${S.money} מטבעות.`,[`🔮 קפסולה – ${PRICE.cap}`,`🧪 שיקוי – ${PRICE.pot}`]);if(i<0)break;const k=i?'pot':'cap';
   if(S.money<PRICE[k]){await say('אין לך מספיק מטבעות.');continue}S.money-=PRICE[k];S.inv[k]++;sfx(990,.1)}await say('תודה ולהתראות!')}

function onStep(){

const P={moving:false,prog:0,tx:0,ty:0};let steps=0,last=0;
function frame(t){const dt=Math.min(50,t-last);last=t;
 if(S){
  if(P.moving){P.prog+=dt/150;if(P.prog>=1){S.x=P.tx;S.y=P.ty;P.moving=false;P.prog=0;onStep()}}
  if(!P.moving&&!busy&&held.length){const d=held[held.length-1];S.dir=d;const[dx,dy]=DV[d];if(free(S.x+dx,S.y+dy)){P.tx=S.x+dx;P.ty=S.y+dy;P.moving=true}}
  const px=(S.x+(P.moving?(P.tx-S.x)*P.prog:0))*16,py=(S.y+(P.moving?(P.ty-S.y)*P.prog:0))*16;
  const cx=Math.round(Math.max(0,Math.min(MW*16-240,px-112))),cy=Math.round(Math.max(0,Math.min(MH*16-160,py-72)));
  const wf='W'+(Math.floor(t/500)%2);
  for(let y=cy>>4;y<=(cy+160)>>4&&y<MH;y++)for(let x=cx>>4;x<=(cx+240)>>4&&x<MW;x++){const c=map[y][x];g.drawImage(tiles[c=='W'?wf:c],x*16-cx,y*16-cy)}
  const ents=[...NPCS.map(n=>({y:n.y*16,d:()=>drawChar(n.x*16-cx,n.y*16-cy-3,n.dir,0,n.c)})),{y:py,d:()=>{const sx=Math.round(px)-cx,sy=Math.round(py)-cy;
   drawChar(sx,sy-3,S.dir,P.moving?(P.prog<.5?1:2):0,{hat:'#e0392b',shirt:'#3b6fd6'});
   if(!P.moving&&map[S.y][S.x]==',')g.drawImage(tiles[','],0,9,16,7,sx,sy+9,16,7)}}];
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d())}
 requestAnimationFrame(frame)}

/* ---------- boot ---------- */
const scr=$('screen'),fit=()=>scr.style.setProperty('--u',scr.clientWidth/240+'px');addEventListener('resize',fit);fit();
let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE))}catch(e){}
if(saved)$('bCont').hidden=false;
function start(s,isNew){S=s;placeNpcs();$('title').hidden=true;busy=false;sfx(660,.1);
 if(isNew)run(async()=>{await say('ברוך הבא לעולם קריטרה! 🌿');await say("בכפר ניצן מחכה לך פרופ' אלון, ליד הבית מימין. דבר איתו כדי לקבל את החיה הראשונה שלך.")})}
$('bCont').onclick=()=>start(saved);
$('bNew').onclick=()=>start(fresh(),true);
requestAnimationFrame(frame);
</script>
